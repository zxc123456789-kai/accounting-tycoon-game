<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#142938">
<title>會計知識王｜機制 04 遊戲</title>
<style>
* { box-sizing: border-box }
html { min-height: 100% }
body { margin: 0 }
body { min-height: 100vh }
body { display: flex }
body { flex-direction: column }
body { align-items: center }
body { background-color: #0c1c29 }
body { color: #f3f4df }
body { font-family: "Microsoft JhengHei", sans-serif }
.page-header { padding: 18px 20px 8px }
.page-header { text-align: center }
.page-header p { margin: 0 0 4px }
.page-header p { color: #a8c1c4 }
.page-header h1 { margin: 0 }
.page-header h1 { font-size: clamp(22px, 4vw, 32px) }
.page-header h1 { color: #f0d184 }
.page-main { width: 100% }
.page-main { display: grid }
.page-main { place-items: center }
.page-main { padding: 8px 16px 20px }
.game-stage { position: relative }
.game-stage { width: min(100%, 960px) }
.game-stage { aspect-ratio: 4 / 3 }
.game-stage { overflow: hidden }
.game-stage { border: 1px solid #42666e }
.game-stage { border-radius: 18px }
.game-stage { background-color: #142938 }
#accountingMemoryGame { width: 100% }
#accountingMemoryGame { height: 100% }
#accountingMemoryGame canvas { display: block }
#accountingMemoryGame canvas { width: 100% !important }
#accountingMemoryGame canvas { height: 100% !important }
.fullscreen-button { position: absolute }
.fullscreen-button { top: 12px }
.fullscreen-button { right: 12px }
.fullscreen-button { z-index: 5 }
.fullscreen-button { padding: 8px 14px }
.fullscreen-button { border: 1px solid #8bc9ae }
.fullscreen-button { border-radius: 999px }
.fullscreen-button { background-color: #f3f4df }
.fullscreen-button { color: #183044 }
.fullscreen-button { font: inherit }
.fullscreen-button { font-weight: 700 }
.fullscreen-button { cursor: pointer }
.game-stage:fullscreen { width: 100vw }
.game-stage:fullscreen { height: 100vh }
.game-stage:fullscreen { display: grid }
.game-stage:fullscreen { place-items: center }
.game-stage:fullscreen { border: 0 }
.game-stage:fullscreen { border-radius: 0 }
.game-stage:fullscreen #accountingMemoryGame { width: 100% }
.game-stage:fullscreen #accountingMemoryGame { height: 100% }
.page-hint { margin: 8px 0 0 }
.page-hint { color: #a8c1c4 }
.page-hint { font-size: 14px }
@media (max-width: 600px) {
  .page-header { padding-top: 10px }
  .page-main { padding: 4px 8px 12px }
  .game-stage { border-radius: 10px }
  .fullscreen-button { top: 7px }
  .fullscreen-button { right: 7px }
  .fullscreen-button { padding: 6px 10px }
}
</style>
</head>
<body>
<header class="page-header">
<p>機制 04　主動回想</p>
<h1>會計科目與分錄知識挑戰</h1>
</header>
<main class="page-main">
<div id="gameStage" class="game-stage">
<div id="accountingMemoryGame" aria-label="會計知識王選擇題對戰遊戲"></div>
<button id="fullscreenButton" class="fullscreen-button" type="button">⛶ 全螢幕</button>
</div>
<p class="page-hint">選擇難度，與電腦進行限時四選一。答對加分，連續答對會提高倍率。</p>
</main>
<script src="https://cdn.jsdelivr.net/npm/phaser@4.2.1/dist/phaser.min.js"></script>
<script>const quizQuestions = {
  simple: [
    { prompt: "現金屬於哪一類會計要素？", choices: ["資產", "負債", "權益", "收入"], answer: 0, explanation: "現金是企業可以支用的資源，屬於資產。" },
    { prompt: "應付帳款代表企業目前有什麼？", choices: ["尚未收回的款項", "尚未償還的付款義務", "業主投入的資本", "已賺得的收入"], answer: 1, explanation: "應付帳款通常來自賒購，表示企業尚未清償的負債。" },
    { prompt: "業主投入現金 50,000 元，企業的資產與權益如何變動？", choices: ["資產增加，權益增加", "資產增加，負債增加", "資產減少，權益增加", "負債減少，權益增加"], answer: 0, explanation: "收到現金使資產增加，業主資本也使權益增加。" },
    { prompt: "用現金支付本月店面租金，正確分錄是哪一個？", choices: ["借記租金費用，貸記現金", "借記現金，貸記租金費用", "借記應付帳款，貸記現金", "借記租金費用，貸記業主資本"], answer: 0, explanation: "租金費用增加記借方，現金減少記貸方。" },
    { prompt: "銷貨收入增加時，通常記在哪一方？", choices: ["借方", "貸方", "借方或貸方都固定", "不需要記錄"], answer: 1, explanation: "收入的正常餘額在貸方，收入增加記貸方。" },
    { prompt: "尚未出售的商品通常列為什麼？", choices: ["存貨資產", "銷貨收入", "租金費用", "應付帳款"], answer: 0, explanation: "準備出售的商品是存貨，屬於資產。" },
    { prompt: "現金銷售商品 3,000 元，銷貨發生時的分錄為何？", choices: ["借記現金，貸記銷貨收入", "借記銷貨收入，貸記現金", "借記應收帳款，貸記現金", "借記存貨，貸記現金"], answer: 0, explanation: "收到現金使現金增加記借方，銷貨收入增加記貸方。" },
    { prompt: "費用增加通常記在哪一方？", choices: ["借方", "貸方", "只記在資產負債表", "不影響權益"], answer: 0, explanation: "費用增加通常記借方，並會減少本期淨利與權益。" }
  ],
  moderate: [
    { prompt: "賒購商品 12,000 元，採永續盤存制，應如何記錄？", choices: ["借記存貨，貸記應付帳款", "借記應付帳款，貸記存貨", "借記現金，貸記銷貨收入", "借記進貨，貸記現金"], answer: 0, explanation: "取得存貨使資產增加記借方，尚未付款形成應付帳款記貸方。" },
    { prompt: "支付本月租金 8,000 元，正確分錄為何？", choices: ["借記租金費用，貸記現金", "借記現金，貸記租金收入", "借記預付租金，貸記應付帳款", "借記應付帳款，貸記租金費用"], answer: 0, explanation: "本月已發生的租金是費用，現金支付後減少。" },
    { prompt: "收到客戶清償先前欠款 6,000 元，哪一組科目改變？", choices: ["借記現金，貸記應收帳款", "借記應收帳款，貸記現金", "借記現金，貸記銷貨收入", "借記應付帳款，貸記現金"], answer: 0, explanation: "現金增加記借方，客戶欠款減少使應收帳款記貸方。" },
    { prompt: "以現金償還應付帳款 4,000 元，正確分錄為何？", choices: ["借記應付帳款，貸記現金", "借記現金，貸記應付帳款", "借記費用，貸記現金", "借記存貨，貸記銷貨收入"], answer: 0, explanation: "負債減少記借方，現金減少記貸方。" },
    { prompt: "業主投入現金 80,000 元作為開業資金，應貸記哪個科目？", choices: ["現金", "業主資本", "銷貨收入", "應付帳款"], answer: 1, explanation: "現金增加記借方，業主資本增加記貸方。" },
    { prompt: "賒銷商品給客戶 9,000 元，銷貨時的分錄為何？", choices: ["借記應收帳款，貸記銷貨收入", "借記銷貨收入，貸記應收帳款", "借記現金，貸記應付帳款", "借記存貨，貸記應收帳款"], answer: 0, explanation: "客戶尚未付款形成應收帳款，銷貨收入同時增加。" },
    { prompt: "以現金購入設備 30,000 元，哪一組科目正確？", choices: ["借記設備，貸記現金", "借記現金，貸記設備", "借記設備費用，貸記銷貨收入", "借記應付帳款，貸記設備"], answer: 0, explanation: "設備增加記借方，現金減少記貸方。" },
    { prompt: "下列哪一組科目增加時通常記借方？", choices: ["資產與費用", "負債與收入", "權益與收入", "負債與權益"], answer: 0, explanation: "資產、費用與業主提款增加時通常記借方。" },
    { prompt: "先收到客戶訂金 5,000 元，商品尚未交付，應貸記什麼？", choices: ["預收收入", "銷貨收入", "租金費用", "應收帳款"], answer: 0, explanation: "尚未履約前，收到的訂金是預收款項，屬於負債。" },
    { prompt: "以現金購入待售商品 7,000 元，採永續盤存制，分錄為何？", choices: ["借記存貨，貸記現金", "借記進貨，貸記應付帳款", "借記現金，貸記存貨", "借記銷貨成本，貸記銷貨收入"], answer: 0, explanation: "永續盤存制下購入商品直接增加存貨，支付現金則貸記現金。" }
  ],
  hard: [
    { prompt: "預付未來六個月店租 36,000 元，付款當下應借記什麼？", choices: ["預付租金", "租金費用", "應付租金", "業主資本"], answer: 0, explanation: "尚未使用的租金服務仍是未來經濟效益，先列為預付費用資產。" },
    { prompt: "月底已發生員工薪資 18,000 元，尚未支付，應如何調整？", choices: ["借記薪資費用，貸記應付薪資", "借記應付薪資，貸記薪資費用", "借記現金，貸記薪資收入", "借記預付薪資，貸記現金"], answer: 0, explanation: "薪資已經發生要認列費用，尚未支付的部分形成負債。" },
    { prompt: "業主提領現金 6,000 元自用，應借記哪個科目？", choices: ["業主提款", "現金", "銷貨收入", "應付帳款"], answer: 0, explanation: "業主提款會減少業主權益，提款增加通常記借方。" },
    { prompt: "賒銷商品 15,000 元給客戶，銷貨分錄的貸方是什麼？", choices: ["銷貨收入", "應收帳款", "現金", "存貨"], answer: 0, explanation: "賒銷使應收帳款增加記借方，銷貨收入增加記貸方。" },
    { prompt: "客戶支付先前的欠款 11,000 元，這筆交易對收入的影響為何？", choices: ["不會再次增加收入", "收入增加 11,000 元", "費用增加 11,000 元", "權益減少 11,000 元"], answer: 0, explanation: "收入在賒銷時已經認列，收款只是在現金與應收帳款間轉換。" },
    { prompt: "賒購辦公設備 40,000 元，交易當下的分錄為何？", choices: ["借記設備，貸記應付帳款", "借記應付帳款，貸記設備", "借記辦公費用，貸記銷貨收入", "借記現金，貸記設備"], answer: 0, explanation: "設備增加記借方，尚未付款形成應付帳款記貸方。" },
    { prompt: "業主投入現金 100,000 元後，會計方程式如何維持平衡？", choices: ["資產與權益同額增加", "資產與負債同額增加", "負債減少且權益增加", "收入與費用同額增加"], answer: 0, explanation: "資產增加 100,000 元，業主權益也增加 100,000 元。" },
    { prompt: "累計折舊通常具有哪一種正常餘額？", choices: ["貸方", "借方", "借貸兩方相同", "沒有餘額"], answer: 0, explanation: "累計折舊是資產抵減科目，通常具有貸方餘額。" },
    { prompt: "本期認列租金費用會如何影響權益？", choices: ["使權益減少", "使權益增加", "不影響權益", "使負債必定增加"], answer: 0, explanation: "費用會減少本期淨利，因此降低業主權益。" },
    { prompt: "企業資產 240,000 元，負債 90,000 元，權益是多少？", choices: ["150,000 元", "330,000 元", "90,000 元", "240,000 元"], answer: 0, explanation: "依資產等於負債加權益，權益為 240,000 減 90,000。" },
    { prompt: "永續盤存制下，退回先前賒購的商品 2,000 元，應如何記錄？", choices: ["借記應付帳款，貸記存貨", "借記存貨，貸記應付帳款", "借記現金，貸記銷貨收入", "借記銷貨成本，貸記現金"], answer: 0, explanation: "退貨使對供應商的欠款減少，也使存貨減少。" },
    { prompt: "收到現金提供服務 9,500 元，正確分錄為何？", choices: ["借記現金，貸記服務收入", "借記服務收入，貸記現金", "借記應收帳款，貸記現金", "借記現金，貸記應付帳款"], answer: 0, explanation: "收到現金使資產增加記借方，服務收入增加記貸方。" }
  ]
}

const difficultySettings = {
  simple: { name: "簡單", rounds: 8, seconds: 20, cpuAccuracy: 0.45, detail: "8 題，每題 20 秒，電腦命中率 45%" },
  moderate: { name: "適中", rounds: 10, seconds: 16, cpuAccuracy: 0.65, detail: "10 題，每題 16 秒，電腦命中率 65%" },
  hard: { name: "困難", rounds: 12, seconds: 12, cpuAccuracy: 0.82, detail: "12 題，每題 12 秒，電腦命中率 82%" }
}

const quizGame = new Phaser.Game({
  type: Phaser.AUTO,
  width: 960,
  height: 720,
  parent: "accountingMemoryGame",
  backgroundColor: "#142938",
  scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
  scene: { create: createQuizGame }
})

function createQuizGame(data) {
  const scene = this

  if (!data || !data.difficulty) {
    showQuizMenu(scene)
    return
  }

  const difficulty = data.difficulty
  const settings = difficultySettings[difficulty]
  const questionList = quizQuestions[difficulty].slice().sort(() => Math.random() - 0.5).slice(0, settings.rounds)
  const letters = ["A", "B", "C", "D"]
  let questionIndex = 0
  let currentQuestion
  let playerScore = 0
  let cpuScore = 0
  let playerStreak = 0
  let cpuStreak = 0
  let bestPlayerStreak = 0
  let timeLeft = settings.seconds
  let roundLocked = true
  let finished = false

  scene.add.text(480, 34, "會計知識王", { fontFamily: "Microsoft JhengHei, sans-serif", fontSize: "38px", color: "#f3f4df", fontStyle: "bold" }).setOrigin(0.5)
  scene.add.text(480, 78, "玩家 VS 電腦", { fontFamily: "Microsoft JhengHei, sans-serif", fontSize: "21px", color: "#a8c1c4" }).setOrigin(0.5)

  const menuPanel = scene.add.rectangle(105, 78, 170, 44, 0x2c5b60).setStrokeStyle(2, 0x8bc9ae).setInteractive({ useHandCursor: true })
  const menuLabel = scene.add.text(105, 78, "返回難度選擇", { fontFamily: "Microsoft JhengHei, sans-serif", fontSize: "17px", color: "#ffffff", fontStyle: "bold" }).setOrigin(0.5)
  menuPanel.on("pointerdown", () => scene.scene.restart())

  scene.add.rectangle(250, 168, 340, 92, 0x1c3b4c).setStrokeStyle(2, 0x4a827b)
  scene.add.rectangle(710, 168, 340, 92, 0x1c3b4c).setStrokeStyle(2, 0x4a827b)
  scene.add.text(250, 140, "玩家", { fontFamily: "Microsoft JhengHei, sans-serif", fontSize: "18px", color: "#a8c1c4" }).setOrigin(0.5)
  scene.add.text(710, 140, "電腦對手", { fontFamily: "Microsoft JhengHei, sans-serif", fontSize: "18px", color: "#a8c1c4" }).setOrigin(0.5)
  const playerScoreText = scene.add.text(250, 170, "0 分", { fontFamily: "Microsoft JhengHei, sans-serif", fontSize: "30px", color: "#f0d184", fontStyle: "bold" }).setOrigin(0.5)
  const cpuScoreText = scene.add.text(710, 170, "0 分", { fontFamily: "Microsoft JhengHei, sans-serif", fontSize: "30px", color: "#f0d184", fontStyle: "bold" }).setOrigin(0.5)
  const playerStreakText = scene.add.text(250, 208, "連對 0 題，倍率 x1", { fontFamily: "Microsoft JhengHei, sans-serif", fontSize: "17px", color: "#d4e8d5" }).setOrigin(0.5)
  const cpuStreakText = scene.add.text(710, 208, "連對 0 題，倍率 x1", { fontFamily: "Microsoft JhengHei, sans-serif", fontSize: "17px", color: "#d4e8d5" }).setOrigin(0.5)

  const difficultyText = scene.add.text(95, 267, settings.name, { fontFamily: "Microsoft JhengHei, sans-serif", fontSize: "20px", color: "#f0d184", fontStyle: "bold" }).setOrigin(0.5)
  const progressText = scene.add.text(480, 267, "第 1 題", { fontFamily: "Microsoft JhengHei, sans-serif", fontSize: "20px", color: "#f3f4df", fontStyle: "bold" }).setOrigin(0.5)
  const timerText = scene.add.text(860, 267, `倒數 ${settings.seconds} 秒`, { fontFamily: "Microsoft JhengHei, sans-serif", fontSize: "20px", color: "#f3f4df", fontStyle: "bold" }).setOrigin(0.5)
  scene.add.rectangle(480, 355, 850, 160, 0x1c3b4c).setStrokeStyle(2, 0x4a827b)
  const questionText = scene.add.text(480, 345, "", { fontFamily: "Microsoft JhengHei, sans-serif", fontSize: "29px", color: "#ffffff", fontStyle: "bold", align: "center", wordWrap: { width: 790 } }).setOrigin(0.5)
  const resultText = scene.add.text(480, 438, "", { fontFamily: "Microsoft JhengHei, sans-serif", fontSize: "18px", color: "#a8e1c9", align: "center", wordWrap: { width: 840 } }).setOrigin(0.5)
  const statusText = scene.add.text(480, 680, "選出答案後，電腦也會作答", { fontFamily: "Microsoft JhengHei, sans-serif", fontSize: "17px", color: "#a8c1c4", align: "center", wordWrap: { width: 870 } }).setOrigin(0.5)

  const optionPositions = [
    { x: 265, y: 525 },
    { x: 695, y: 525 },
    { x: 265, y: 605 },
    { x: 695, y: 605 }
  ]
  const optionPanels = optionPositions.map((position, index) => {
    const panel = scene.add.rectangle(position.x, position.y, 400, 68, 0x24475a).setStrokeStyle(2, 0x628a83).setInteractive({ useHandCursor: true })
    const label = scene.add.text(position.x, position.y, `${letters[index]}　`, { fontFamily: "Microsoft JhengHei, sans-serif", fontSize: "19px", color: "#f3f4df", align: "left", wordWrap: { width: 350 } }).setOrigin(0.5)
    panel.on("pointerdown", () => answerQuestion(index))
    panel.on("pointerover", () => {
      if (!roundLocked) panel.setFillStyle(0x31586a)
    })
    panel.on("pointerout", () => {
      if (!roundLocked) panel.setFillStyle(0x24475a)
    })
    return { panel, label }
  })

  const multiplierFor = (streak) => Math.max(1, Math.min(5, streak))
  const updateScores = () => {
    playerScoreText.setText(`${playerScore} 分`)
    cpuScoreText.setText(`${cpuScore} 分`)
    playerStreakText.setText(`連對 ${playerStreak} 題，倍率 x${multiplierFor(playerStreak)}`)
    cpuStreakText.setText(`連對 ${cpuStreak} 題，倍率 x${multiplierFor(cpuStreak)}`)
  }

  const showResults = () => {
    finished = true
    roundLocked = true
    optionPanels.forEach((option) => option.panel.disableInteractive())
    questionText.setText("本場對戰結束")
    resultText.setColor("#f0d184")
    const winner = playerScore > cpuScore ? "恭喜你獲勝" : playerScore < cpuScore ? "電腦獲勝，再挑戰一次" : "雙方平手，再挑戰一次"
    resultText.setText(`${winner}，你的最高連對紀錄是 ${bestPlayerStreak} 題。`)
    statusText.setText(`最終比分　玩家 ${playerScore} 分　對上　電腦 ${cpuScore} 分`)
    menuLabel.setText("再選一個難度")
  }

  const loadQuestion = () => {
    if (questionIndex >= questionList.length) {
      showResults()
      return
    }

    currentQuestion = questionList[questionIndex]
    timeLeft = settings.seconds
    roundLocked = false
    progressText.setText(`第 ${questionIndex + 1} 題，共 ${questionList.length} 題`)
    timerText.setColor("#f3f4df")
    timerText.setText(`倒數 ${timeLeft} 秒`)
    questionText.setText(currentQuestion.prompt)
    resultText.setText("")
    statusText.setText("選出答案後，電腦也會作答")

    optionPanels.forEach((option, index) => {
      option.panel.setFillStyle(0x24475a)
      option.panel.setStrokeStyle(2, 0x628a83)
      option.panel.setInteractive({ useHandCursor: true })
      option.label.setText(`${letters[index]}　${currentQuestion.choices[index]}`)
    })
  }

  const answerQuestion = (playerChoice) => {
    if (roundLocked || finished) return
    roundLocked = true
    statusText.setText("你已作答，電腦正在思考")

    scene.time.delayedCall(850, () => {
      const cpuCorrect = Math.random() < settings.cpuAccuracy
      const wrongAnswers = currentQuestion.choices.map((option, index) => index).filter((index) => index !== currentQuestion.answer)
      const cpuChoice = cpuCorrect ? currentQuestion.answer : wrongAnswers[Math.floor(Math.random() * wrongAnswers.length)]
      const playerCorrect = playerChoice === currentQuestion.answer
      let playerPoints = 0
      let cpuPoints = 0

      if (playerCorrect) {
        playerStreak += 1
        bestPlayerStreak = Math.max(bestPlayerStreak, playerStreak)
        playerPoints = 100 * multiplierFor(playerStreak)
        playerScore += playerPoints
      } else {
        playerStreak = 0
      }

      if (cpuCorrect) {
        cpuStreak += 1
        cpuPoints = 100 * multiplierFor(cpuStreak)
        cpuScore += cpuPoints
      } else {
        cpuStreak = 0
      }

      optionPanels.forEach((option, index) => {
        option.panel.disableInteractive()
        if (index === currentQuestion.answer) {
          option.panel.setFillStyle(0x235849)
          option.panel.setStrokeStyle(3, 0x8bd3a8)
        } else if (index === playerChoice) {
          option.panel.setFillStyle(0x713f46)
          option.panel.setStrokeStyle(3, 0xffa9a9)
        } else {
          option.panel.setFillStyle(0x24475a)
          option.panel.setStrokeStyle(2, 0x628a83)
        }

        if (index === cpuChoice && !cpuCorrect) option.panel.setStrokeStyle(3, 0xf0d184)
      })

      updateScores()
      resultText.setColor("#a8e1c9")
      resultText.setText(`正確答案 ${letters[currentQuestion.answer]}。${currentQuestion.explanation}`)
      const playerMessage = playerChoice === -1 ? "你逾時未答" : playerCorrect ? `你答對，獲得 ${playerPoints} 分` : "你答錯，連對中斷"
      const cpuMessage = cpuCorrect ? `電腦答對，獲得 ${cpuPoints} 分` : "電腦答錯"
      statusText.setText(`${playerMessage}。${cpuMessage}。黃色外框是電腦選項。`)

      scene.time.delayedCall(2700, () => {
        if (finished) return
        questionIndex += 1
        loadQuestion()
      })
    })
  }

  scene.time.addEvent({
    delay: 1000,
    loop: true,
    callback: () => {
      if (roundLocked || finished) return
      timeLeft -= 1
      timerText.setText(`倒數 ${timeLeft} 秒`)
      if (timeLeft <= 5) timerText.setColor("#ffad91")
      if (timeLeft <= 0) answerQuestion(-1)
    }
  })

  loadQuestion()
}

function showQuizMenu(scene) {
  scene.add.text(480, 78, "會計知識王", { fontFamily: "Microsoft JhengHei, sans-serif", fontSize: "46px", color: "#f3f4df", fontStyle: "bold" }).setOrigin(0.5)
  scene.add.text(480, 140, "玩家 VS 電腦　會計選擇題挑戰", { fontFamily: "Microsoft JhengHei, sans-serif", fontSize: "24px", color: "#a8c1c4" }).setOrigin(0.5)
  scene.add.text(480, 205, "每題答對可得 100 分，連續答對時倍率逐題上升，最高 x5", { fontFamily: "Microsoft JhengHei, sans-serif", fontSize: "20px", color: "#f0d184", align: "center", wordWrap: { width: 820 } }).setOrigin(0.5)

  const levels = [
    { id: "simple", x: 180, color: 0x2c5b60, name: "簡單", detail: "8 題，每題 20 秒\n電腦命中率 45%" },
    { id: "moderate", x: 480, color: 0x356477, name: "適中", detail: "10 題，每題 16 秒\n電腦命中率 65%" },
    { id: "hard", x: 780, color: 0x704d49, name: "困難", detail: "12 題，每題 12 秒\n電腦命中率 82%" }
  ]

  levels.forEach((level) => {
    const panel = scene.add.rectangle(level.x, 405, 260, 230, level.color).setStrokeStyle(3, 0x8bc9ae).setInteractive({ useHandCursor: true })
    const title = scene.add.text(level.x, 354, level.name, { fontFamily: "Microsoft JhengHei, sans-serif", fontSize: "34px", color: "#ffffff", fontStyle: "bold" }).setOrigin(0.5)
    const detail = scene.add.text(level.x, 430, level.detail, { fontFamily: "Microsoft JhengHei, sans-serif", fontSize: "21px", color: "#e8f1e8", align: "center", lineSpacing: 10 }).setOrigin(0.5)
    const action = scene.add.text(level.x, 488, "點擊開始對戰", { fontFamily: "Microsoft JhengHei, sans-serif", fontSize: "18px", color: "#f0d184", fontStyle: "bold" }).setOrigin(0.5)
    panel.on("pointerover", () => panel.setScale(1.03))
    panel.on("pointerout", () => panel.setScale(1))
    panel.on("pointerdown", () => scene.scene.restart({ difficulty: level.id }))
    title.setInteractive({ useHandCursor: true }).on("pointerdown", () => scene.scene.restart({ difficulty: level.id }))
    detail.setInteractive({ useHandCursor: true }).on("pointerdown", () => scene.scene.restart({ difficulty: level.id }))
    action.setInteractive({ useHandCursor: true }).on("pointerdown", () => scene.scene.restart({ difficulty: level.id }))
  })

  scene.add.text(480, 580, "選項包含科目分類、借貸方向與會計分錄，答題後會公布答案與解說", { fontFamily: "Microsoft JhengHei, sans-serif", fontSize: "18px", color: "#a8c1c4", align: "center", wordWrap: { width: 850 } }).setOrigin(0.5)
}
</script>
<script>
const gameStage = document.getElementById("gameStage")
const fullscreenButton = document.getElementById("fullscreenButton")

fullscreenButton.addEventListener("click", async () => {
  try {
    if (document.fullscreenElement === gameStage) {
      await document.exitFullscreen()
    } else {
      await gameStage.requestFullscreen()
    }
  } catch {
    fullscreenButton.textContent = "全螢幕無法開啟"
  }
})

document.addEventListener("fullscreenchange", () => {
  const active = document.fullscreenElement === gameStage
  fullscreenButton.textContent = active ? "離開全螢幕" : "⛶ 全螢幕"
})
</script>
